<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;">
  <!-- Header -->
  <rect x="20" y="20" width="800" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="55" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">生命保険の基本3形態（定期保険・終身保険・養老保険）</text>

  <!-- Type 1: 定期保険 -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="250" height="380" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="45" rx="12" fill="#2563eb"/>
    <rect x="0" y="30" width="250" height="15" fill="#2563eb"/>
    <text x="125" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1. 定期保険 （掛け捨て型）</text>

    <!-- Graph Box -->
    <rect x="15" y="60" width="220" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="35" y="80" width="140" height="70" fill="#3b82f6" opacity="0.7" stroke="#2563eb" stroke-width="1.5"/>
    <text x="105" y="120" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">死亡保障</text>
    
    <line x1="35" y1="150" x2="205" y2="150" stroke="#64748b" stroke-width="1.5"/>
    <text x="35" y="170" font-size="10" fill="#64748b">契約</text>
    <text x="175" y="170" font-size="10" fill="#64748b">満期</text>
    <text x="210" y="170" font-size="10" fill="#dc2626">終了</text>

    <!-- Description -->
    <text x="20" y="225" font-size="14" font-weight="bold" fill="#1d4ed8">• 保障期間： 一定期間（限定）</text>
    <text x="20" y="250" font-size="13" fill="#0f172a">• 満期保険金： なし</text>
    <text x="20" y="275" font-size="13" fill="#0f172a">• 解約返戻金： なし（または極小）</text>
    <text x="20" y="300" font-size="13" fill="#0f172a">• 保険料： 3形態の中で最も安い</text>
    <text x="20" y="335" font-size="12" fill="#64748b">用途：高額な死亡保障を割安に準備（子育て期の遺族保障など）</text>
  </g>

  <!-- Type 2: 終身保険 -->
  <g transform="translate(295, 95)">
    <rect x="0" y="0" width="250" height="380" rx="12" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="45" rx="12" fill="#059669"/>
    <rect x="0" y="30" width="250" height="15" fill="#059669"/>
    <text x="125" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2. 終身保険 （一生涯保障）</text>

    <!-- Graph Box -->
    <rect x="15" y="60" width="220" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="35" y="80" width="180" height="70" fill="#10b981" opacity="0.7" stroke="#059669" stroke-width="1.5"/>
    <text x="125" y="120" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">死亡保障（一生涯）</text>
    
    <path d="M 35 150 Q 120 150 215 100 L 215 150 Z" fill="#f59e0b" opacity="0.6"/>
    <text x="155" y="142" font-size="10" font-weight="bold" fill="#b45309">解約返戻金積立</text>

    <line x1="35" y1="150" x2="215" y2="150" stroke="#64748b" stroke-width="1.5"/>
    <text x="35" y="170" font-size="10" fill="#64748b">契約</text>
    <text x="180" y="170" font-size="10" fill="#047857">死亡時まで継続</text>

    <!-- Description -->
    <text x="20" y="225" font-size="14" font-weight="bold" fill="#047857">• 保障期間： 一生涯（無期限）</text>
    <text x="20" y="250" font-size="13" fill="#0f172a">• 満期保険金： なし（満期がない）</text>
    <text x="20" y="275" font-size="13" fill="#0f172a">• 解約返戻金： 経過とともに蓄積</text>
    <text x="20" y="300" font-size="13" fill="#0f172a">• 保険料： 定期保険より高め</text>
    <text x="20" y="335" font-size="12" fill="#64748b">用途：葬儀費用、相続税の納税資金確保、解約返戻金の老後活用</text>
  </g>

  <!-- Type 3: 養老保険 -->
  <g transform="translate(570, 95)">
    <rect x="0" y="0" width="250" height="380" rx="12" fill="#f8fafc" stroke="#d97706" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="45" rx="12" fill="#d97706"/>
    <rect x="0" y="30" width="250" height="15" fill="#d97706"/>
    <text x="125" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3. 養老保険 （保障＋貯蓄）</text>

    <!-- Graph Box -->
    <rect x="15" y="60" width="220" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="35" y="80" width="140" height="70" fill="#f59e0b" opacity="0.7" stroke="#d97706" stroke-width="1.5"/>
    <text x="105" y="110" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">死亡保障</text>
    
    <rect x="175" y="80" width="30" height="70" fill="#d97706" stroke="#b45309"/>
    <text x="190" y="120" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(90 190 120)">満期保険金</text>

    <line x1="35" y1="150" x2="205" y2="150" stroke="#64748b" stroke-width="1.5"/>
    <text x="35" y="170" font-size="10" fill="#64748b">契約</text>
    <text x="175" y="170" font-size="10" fill="#b45309">満期受取</text>

    <!-- Description -->
    <text x="20" y="225" font-size="14" font-weight="bold" fill="#b45309">• 保障期間： 一定期間（限定）</text>
    <text x="20" y="250" font-size="13" fill="#0f172a">• 満期保険金： 死亡保険金と【同額】</text>
    <text x="20" y="275" font-size="13" fill="#0f172a">• 解約返戻金： 非常に高く積み上がる</text>
    <text x="20" y="300" font-size="13" fill="#0f172a">• 保険料： 3形態の中で最も高い</text>
    <text x="20" y="335" font-size="12" fill="#64748b">用途：生存・死亡どちらでも確実に資金準備（教育・退職資金等）</text>
  </g>
</svg>
