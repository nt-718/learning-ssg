<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;">
  <!-- Header -->
  <rect x="20" y="20" width="800" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="55" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">【FP最重要】 法定相続人と法定相続分の決定ツリー</text>

  <!-- Spouse (Always Heir) Box -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="800" height="65" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="65" rx="10" fill="#2563eb"/>
    <rect x="210" y="0" width="10" height="65" fill="#2563eb"/>
    <text x="110" y="38" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">常に相続人： 配偶者</text>
    <text x="240" y="38" font-size="14" fill="#0f172a">※配偶者は常に同順位の血族相続人と一緒に相続人となる（内縁関係を除く）</text>
  </g>

  <!-- Rank 1 (Children) -->
  <g transform="translate(20, 175)">
    <rect x="0" y="0" width="800" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="100" rx="10" fill="#059669"/>
    <rect x="150" y="0" width="10" height="100" fill="#059669"/>
    <text x="80" y="45" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">第 1 順位</text>
    <text x="80" y="70" font-size="14" font-weight="bold" fill="#d1fae5" text-anchor="middle">子 （孫）</text>

    <!-- Shares -->
    <g transform="translate(180, 15)">
      <rect x="0" y="0" width="290" height="70" rx="8" fill="#ffffff" stroke="#059669"/>
      <text x="145" y="28" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">【法定相続分】</text>
      <text x="145" y="52" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">配偶者 1/2  ：  子 1/2</text>
    </g>

    <g transform="translate(485, 15)">
      <rect x="0" y="0" width="300" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="15" y="28" font-size="13" font-weight="bold" fill="#1d4ed8">• 代襲相続： 孫・ひ孫へ何代でも可</text>
      <text x="15" y="52" font-size="13" fill="#0f172a">• 子が複数の場合： 1/2を均等割</text>
    </g>
  </g>

  <!-- Rank 2 (Parents) -->
  <g transform="translate(20, 290)">
    <rect x="0" y="0" width="800" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="100" rx="10" fill="#d97706"/>
    <rect x="150" y="0" width="10" height="100" fill="#d97706"/>
    <text x="80" y="40" font-size="15" stroke-linecap="round" font-weight="bold" fill="#ffffff" text-anchor="middle">第 2 順位</text>
    <text x="80" y="65" font-size="13" font-weight="bold" fill="#fef3c7" text-anchor="middle">直系尊属（父母）</text>
    <text x="80" y="85" font-size="10" fill="#fef3c7" text-anchor="middle">※子がいない場合</text>

    <!-- Shares -->
    <g transform="translate(180, 15)">
      <rect x="0" y="0" width="290" height="70" rx="8" fill="#ffffff" stroke="#d97706"/>
      <text x="145" y="28" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">【法定相続分】</text>
      <text x="145" y="52" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">配偶者 2/3  ：  直系尊属 1/3</text>
    </g>

    <g transform="translate(485, 15)">
      <rect x="0" y="0" width="300" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="15" y="28" font-size="13" font-weight="bold" fill="#1d4ed8">• 親しい世代を優先（実親→祖父母）</text>
      <text x="15" y="52" font-size="13" fill="#0f172a">• 父母ともに健在なら 1/3を均等割</text>
    </g>
  </g>

  <!-- Rank 3 (Siblings) -->
  <g transform="translate(20, 405)">
    <rect x="0" y="0" width="800" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="100" rx="10" fill="#dc2626"/>
    <rect x="150" y="0" width="10" height="100" fill="#dc2626"/>
    <text x="80" y="40" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">第 3 順位</text>
    <text x="80" y="65" font-size="13" font-weight="bold" fill="#fee2e2" text-anchor="middle">兄弟姉妹（甥姪）</text>
    <text x="80" y="85" font-size="10" fill="#fee2e2" text-anchor="middle">※子・直系尊属なし</text>

    <!-- Shares -->
    <g transform="translate(180, 15)">
      <rect x="0" y="0" width="290" height="70" rx="8" fill="#ffffff" stroke="#dc2626"/>
      <text x="145" y="28" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">【法定相続分】</text>
      <text x="145" y="52" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">配偶者 3/4  ：  兄弟姉妹 1/4</text>
    </g>

    <g transform="translate(485, 15)">
      <rect x="0" y="0" width="300" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="15" y="28" font-size="13" font-weight="bold" fill="#b91c1c">• 代襲相続は【甥・姪（1代限り）】</text>
      <text x="15" y="52" font-size="13" fill="#0f172a">• 兄弟姉妹には【遺留分がない】！</text>
    </g>
  </g>
</svg>
