<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;">
  <!-- Header -->
  <rect x="20" y="20" width="800" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="55" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">住宅ローン返済方式の比較（元利均等返済 vs 元金均等返済）</text>

  <!-- Left: 元利均等返済 -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="380" height="380" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="45" rx="12" fill="#2563eb"/>
    <rect x="0" y="30" width="380" height="15" fill="#2563eb"/>
    <text x="190" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">元利均等返済（毎回の返済額が一定）</text>

    <!-- Visual Graph Container -->
    <rect x="20" y="60" width="340" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    
    <!-- Repayment Box -->
    <path d="M 30 100 Q 180 180 350 230 L 350 240 L 30 240 Z" fill="#3b82f6" opacity="0.75"/> <!-- Principal (bottom) -->
    <path d="M 30 90 L 350 90 L 350 230 Q 180 180 30 100 Z" fill="#ef4444" opacity="0.75"/> <!-- Interest (top) -->

    <!-- Top Border Line: Fixed Repayment -->
    <line x1="30" y1="90" x2="350" y2="90" stroke="#1d4ed8" stroke-width="3"/>
    <text x="190" y="80" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">毎回の返済額（一定）</text>

    <text x="190" y="130" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">利息部分（当初大きい）</text>
    <text x="190" y="210" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">元金部分（後半増える）</text>

    <text x="30" y="255" font-size="11" fill="#64748b">返済開始</text>
    <text x="320" y="255" font-size="11" fill="#64748b">返済終了</text>

    <!-- Explanatory Bullet Points -->
    <text x="25" y="285" font-size="13" fill="#0f172a">• 毎月の返済額が変わらないため返済計画が立てやすい</text>
    <text x="25" y="310" font-size="13" fill="#0f172a">• 返済当初は利息割合が高く元金の減少が遅い</text>
    <text x="25" y="335" font-size="13" font-weight="bold" fill="#b91c1c">• 同条件の場合、総返済額は元金均等より多くなる</text>
  </g>

  <!-- Right: 元金均等返済 -->
  <g transform="translate(440, 95)">
    <rect x="0" y="0" width="380" height="380" rx="12" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="45" rx="12" fill="#059669"/>
    <rect x="0" y="30" width="380" height="15" fill="#059669"/>
    <text x="190" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">元金均等返済（毎回の元金が一定）</text>

    <!-- Visual Graph Container -->
    <rect x="20" y="60" width="340" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1"/>

    <!-- Slanted Top Line (Decreasing Repayment) -->
    <path d="M 30 160 L 350 160 L 350 240 L 30 240 Z" fill="#10b981" opacity="0.75"/> <!-- Principal (bottom rectangle) -->
    <path d="M 30 70 L 350 160 L 30 160 Z" fill="#ef4444" opacity="0.75"/> <!-- Interest (top triangle) -->

    <!-- Top Slanted Line -->
    <line x1="30" y1="70" x2="350" y2="160" stroke="#047857" stroke-width="3"/>
    <text x="120" y="105" font-size="12" font-weight="bold" fill="#047857">返済額（当初最大〜徐々に減少）</text>

    <text x="100" y="140" font-size="13" font-weight="bold" fill="#ffffff">利息部分</text>
    <text x="190" y="205" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">元金部分（一定）</text>

    <text x="30" y="255" font-size="11" fill="#64748b">返済開始</text>
    <text x="320" y="255" font-size="11" fill="#64748b">返済終了</text>

    <!-- Explanatory Bullet Points -->
    <text x="25" y="285" font-size="13" fill="#0f172a">• 元金が均等に減るため残高の減りが早い</text>
    <text x="25" y="310" font-size="13" fill="#0f172a">• 返済開始当初の返済負担（毎月支払額）が最も大きい</text>
    <text x="25" y="335" font-size="13" font-weight="bold" fill="#047857">• 同条件の場合、総返済額は元利均等より少なくなる</text>
  </g>
</svg>
