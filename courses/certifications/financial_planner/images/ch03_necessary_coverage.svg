<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;">
  <!-- Header -->
  <rect x="20" y="20" width="800" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="55" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">必要保障額の推移 と 算出メカニズム（三角錐イメージ）</text>

  <!-- Left: Formula & Concept -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="370" height="380" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="370" height="45" rx="12" fill="#2563eb"/>
    <rect x="0" y="30" width="370" height="15" fill="#2563eb"/>
    <text x="185" y="28" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">必要保障額の基本計算式</text>

    <!-- Formula Box -->
    <rect x="15" y="60" width="340" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="185" y="88" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">必要保障額 ＝</text>
    <text x="185" y="115" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">遺族の必要資金総額 － 公的保障・既保有資産</text>

    <!-- Details -->
    <text x="25" y="180" font-size="14" font-weight="bold" fill="#dc2626">1. 遺族の必要資金総額</text>
    <text x="40" y="202" font-size="13" fill="#0f172a">• 遺族生活費（末子独立まで ＋ その後）</text>
    <text x="40" y="222" font-size="13" fill="#0f172a">• 子の教育資金・結婚援助資金</text>
    <text x="40" y="242" font-size="13" fill="#0f172a">• 住居費（団信加入時は不要化）</text>

    <text x="25" y="275" font-size="14" font-weight="bold" fill="#059669">2. 収入見込額（差し引く金額）</text>
    <text x="40" y="297" font-size="13" fill="#0f172a">• 遺族年金（遺族基礎年金・遺族厚生年金）</text>
    <text x="40" y="317" font-size="13" fill="#0f172a">• 死亡退職金・慶弔金</text>
    <text x="40" y="337" font-size="13" fill="#0f172a">• 既保有の預貯金・有価証券等</text>
  </g>

  <!-- Right: Visual Graph (Triangle Diagram) -->
  <g transform="translate(410, 95)">
    <rect x="0" y="0" width="410" height="380" rx="12" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="410" height="45" rx="12" fill="#059669"/>
    <rect x="0" y="30" width="410" height="15" fill="#059669"/>
    <text x="205" y="28" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">必要保障額の時間経過推移</text>

    <!-- Graph Axes Container -->
    <rect x="20" y="60" width="370" height="300" rx="8" fill="#ffffff" stroke="#cbd5e1"/>

    <!-- Assets / Pension Base Layer (Bottom Rectangle) -->
    <rect x="40" y="270" width="330" height="60" fill="#10b981" opacity="0.8" stroke="#059669"/>
    <text x="205" y="305" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">公的遺族年金 ＋ 既保有預貯金・資産</text>

    <!-- Required Insurance Triangle (Top Triangle) -->
    <path d="M 40 100 L 370 270 L 40 270 Z" fill="#ef4444" opacity="0.75" stroke="#dc2626" stroke-width="2"/>
    <text x="140" y="200" font-size="16" font-weight="bold" fill="#ffffff">必要保障額</text>
    <text x="140" y="222" font-size="12" fill="#ffffff">（年数が経つほど減少する）</text>

    <!-- Top Total Needs Line -->
    <line x1="40" y1="100" x2="370" y2="270" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5"/>
    <text x="210" y="160" font-size="12" font-weight="bold" fill="#b45309" transform="rotate(27 210 160)">遺族の必要支出総額ライン</text>

    <!-- Axis Labels -->
    <text x="35" y="90" font-size="11" fill="#64748b">金額（万円）</text>
    <text x="40" y="348" font-size="11" fill="#64748b">子供誕生時（30歳）</text>
    <text x="200" y="348" font-size="11" fill="#64748b">末子独立時（52歳）</text>
    <text x="325" y="348" font-size="11" fill="#64748b">退職（65歳）</text>
  </g>
</svg>
