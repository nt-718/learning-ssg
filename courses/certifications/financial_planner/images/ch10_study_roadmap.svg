<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;">
  <!-- Header -->
  <rect x="20" y="20" width="800" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="55" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">FP3級から2級一発合格への 5ステップ学習ロードマップ</text>

  <!-- Timeline Container -->
  <g transform="translate(20, 95)">
    <!-- Central Timeline Bar -->
    <rect x="20" y="20" width="760" height="8" rx="4" fill="#cbd5e1"/>

    <!-- Step 1 -->
    <g transform="translate(10, 0)">
      <circle cx="20" cy="24" r="18" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
      <text x="20" y="30" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <rect x="0" y="60" width="140" height="320" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
      <rect x="0" y="60" width="140" height="40" rx="10" fill="#2563eb"/>
      <rect x="0" y="90" width="140" height="10" fill="#2563eb"/>
      <text x="70" y="85" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">【Step 1】 基礎</text>

      <text x="15" y="125" font-size="13" font-weight="bold" fill="#1d4ed8">3級基礎インプット</text>
      <text x="15" y="150" font-size="12" fill="#0f172a">• 第1章〜第7章の</text>
      <text x="20" y="170" font-size="12" fill="#0f172a">［3級］基礎本文を</text>
      <text x="20" y="190" font-size="12" fill="#0f172a">一通り読む</text>
      <text x="15" y="220" font-size="12" fill="#0f172a">• 6分野の全体像と</text>
      <text x="20" y="240" font-size="12" fill="#0f172a">基本用語の理解</text>

      <rect x="10" y="325" width="120" height="40" rx="6" fill="#ffffff" stroke="#2563eb"/>
      <text x="70" y="350" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">目安： 1〜2週間</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(165, 0)">
      <circle cx="20" cy="24" r="18" fill="#059669" stroke="#ffffff" stroke-width="2"/>
      <text x="20" y="30" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <rect x="0" y="60" width="140" height="320" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
      <rect x="0" y="60" width="140" height="40" rx="10" fill="#059669"/>
      <rect x="0" y="90" width="140" height="10" fill="#059669"/>
      <text x="70" y="85" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">【Step 2】 演習</text>

      <text x="15" y="125" font-size="13" font-weight="bold" fill="#047857">3級アウトプット</text>
      <text x="15" y="150" font-size="12" fill="#0f172a">• 各章の［3級］</text>
      <text x="20" y="170" font-size="12" fill="#0f172a">章末問題を解く</text>
      <text x="15" y="200" font-size="12" fill="#0f172a">• 基本計算公式</text>
      <text x="20" y="220" font-size="12" fill="#0f172a">（係数・年金・税）</text>
      <text x="20" y="240" font-size="12" fill="#0f172a">を手で計算する</text>

      <rect x="10" y="325" width="120" height="40" rx="6" fill="#ffffff" stroke="#059669"/>
      <text x="70" y="350" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">目安： 1〜2週間</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(320, 0)">
      <circle cx="20" cy="24" r="18" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
      <text x="20" y="30" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <rect x="0" y="60" width="140" height="320" rx="10" fill="#f8fafc" stroke="#d97706" stroke-width="2"/>
      <rect x="0" y="60" width="140" height="40" rx="10" fill="#d97706"/>
      <rect x="0" y="90" width="140" height="10" fill="#d97706"/>
      <text x="70" y="85" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">【Step 3】 深掘り</text>

      <text x="15" y="125" font-size="13" font-weight="bold" fill="#b45309">2級深掘りインプット</text>
      <text x="15" y="150" font-size="12" fill="#0f172a">• 本文の「2級への</text>
      <text x="20" y="170" font-size="12" fill="#0f172a">深掘り」コーナーを</text>
      <text x="20" y="190" font-size="12" fill="#0f172a">熟読する</text>
      <text x="15" y="220" font-size="12" fill="#0f172a">• 例外規程・特例・</text>
      <text x="20" y="240" font-size="12" fill="#0f172a">複雑計算のロジック</text>
      <text x="20" y="260" font-size="12" fill="#0f172a">を押さえる</text>

      <rect x="10" y="325" width="120" height="40" rx="6" fill="#ffffff" stroke="#d97706"/>
      <text x="70" y="350" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">目安： 2〜3週間</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(475, 0)">
      <circle cx="20" cy="24" r="18" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
      <text x="20" y="30" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      <rect x="0" y="60" width="140" height="320" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
      <rect x="0" y="60" width="140" height="40" rx="10" fill="#7c3aed"/>
      <rect x="0" y="90" width="140" height="10" fill="#7c3aed"/>
      <text x="70" y="85" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">【Step 4】 実技</text>

      <text x="15" y="125" font-size="13" font-weight="bold" fill="#6d28d9">実技特化・問題演習</text>
      <text x="15" y="150" font-size="12" fill="#0f172a">• 第8章の実技攻略</text>
      <text x="20" y="170" font-size="12" fill="#0f172a">を3周マスター</text>
      <text x="15" y="195" font-size="12" fill="#0f172a">• 第11章の追加</text>
      <text x="20" y="215" font-size="12" fill="#0f172a">96問を解き切る</text>
      <text x="15" y="240" font-size="12" fill="#0f172a">• 電卓操作・資料</text>
      <text x="20" y="260" font-size="12" fill="#0f172a">読解力を鍛える</text>

      <rect x="10" y="325" width="120" height="40" rx="6" fill="#ffffff" stroke="#7c3aed"/>
      <text x="70" y="350" font-size="12" font-weight="bold" fill="#6d28d9" text-anchor="middle">目安： 2週間</text>
    </g>

    <!-- Step 5 -->
    <g transform="translate(630, 0)">
      <circle cx="20" cy="24" r="18" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
      <text x="20" y="30" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
      <rect x="0" y="60" width="140" height="320" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
      <rect x="0" y="60" width="140" height="40" rx="10" fill="#dc2626"/>
      <rect x="0" y="90" width="140" height="10" fill="#dc2626"/>
      <text x="70" y="85" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">【Step 5】 直前</text>

      <text x="15" y="125" font-size="13" font-weight="bold" fill="#b91c1c">直前総まとめ・総復習</text>
      <text x="15" y="150" font-size="12" fill="#0f172a">• 第9章の公式・</text>
      <text x="20" y="170" font-size="12" fill="#0f172a">数値・要点を暗記</text>
      <text x="15" y="195" font-size="12" fill="#0f172a">• 間違えた問題の</text>
      <text x="20" y="215" font-size="12" fill="#0f172a">理由説明スパイラル</text>
      <text x="15" y="240" font-size="12" fill="#0f172a">• 弱点分野のみ</text>
      <text x="20" y="260" font-size="12" fill="#0f172a">本文に戻ってピンポイント補強</text>

      <rect x="10" y="325" width="120" height="40" rx="6" fill="#ffffff" stroke="#dc2626"/>
      <text x="70" y="350" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">直前 1週間</text>
    </g>
  </g>
</svg>
