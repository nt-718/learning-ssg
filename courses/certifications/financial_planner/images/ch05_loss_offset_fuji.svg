<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;">
  <!-- Header -->
  <rect x="20" y="20" width="800" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="55" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">損益通算ができる4つの所得語呂合わせ 「ふ・じ・さん （富士山）」</text>

  <!-- Left: Fuji Mountain Visual & 4 Eligible Incomes -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="450" height="380" rx="12" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="450" height="45" rx="12" fill="#059669"/>
    <rect x="0" y="30" width="450" height="15" fill="#059669"/>
    <text x="225" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">損益通算できる4つの所得 （赤字を他所得と相殺可）</text>

    <!-- 4 Cards -->
    <g transform="translate(15, 60)">
      <!-- 1. 不動産所得 -->
      <rect x="0" y="0" width="205" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="0" y="0" width="205" height="35" rx="8" fill="#ecfdf5"/>
      <text x="102" y="23" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">「ふ」 不動産所得</text>
      <text x="15" y="55" font-size="12" fill="#0f172a">• 賃貸アパート・駐車場等</text>
      <text x="15" y="75" font-size="12" fill="#b91c1c">• 【注意】土地取得対価の</text>
      <text x="25" y="93" font-size="12" fill="#b91c1c">借入金利子分は対象外！</text>
      <text x="15" y="115" font-size="11" fill="#64748b">（建物分の利子は通算可）</text>

      <!-- 2. 事業所得 -->
      <rect x="215" y="0" width="205" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="215" y="0" width="205" height="35" rx="8" fill="#ecfdf5"/>
      <text x="317" y="23" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">「じ」 事業所得</text>
      <text x="230" y="55" font-size="12" fill="#0f172a">• 農業・商工業・フリーランス</text>
      <text x="230" y="75" font-size="12" fill="#0f172a">• 継続的な事業による損失</text>
      <text x="230" y="115" font-size="11" fill="#64748b">※副業の雑所得赤字は対象外</text>

      <!-- 3. 譲渡所得 -->
      <rect x="0" y="150" width="205" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="0" y="150" width="205" height="35" rx="8" fill="#ecfdf5"/>
      <text x="102" y="173" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">「さ」 譲渡所得</text>
      <text x="15" y="205" font-size="12" fill="#0f172a">• 総合課税の資産譲渡損失</text>
      <text x="15" y="225" font-size="12" fill="#b91c1c">• 【注意】生活用動産・</text>
      <text x="25" y="243" font-size="12" fill="#b91c1c">ゴルフ会員権等の損失は</text>
      <text x="25" y="261" font-size="12" fill="#b91c1c">損益通算不可（改正）</text>

      <!-- 4. 山林所得 -->
      <rect x="215" y="150" width="205" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="215" y="150" width="205" height="35" rx="8" fill="#ecfdf5"/>
      <text x="317" y="173" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">「ん」 山林所得</text>
      <text x="230" y="205" font-size="12" fill="#0f172a">• 山林の伐採・譲渡損失</text>
      <text x="230" y="225" font-size="12" fill="#0f172a">• 5年超保有の山林が対象</text>
      <text x="230" y="261" font-size="11" fill="#64748b">※他の所得と通算可能</text>
    </g>
  </g>

  <!-- Right: Non-Eligible Incomes -->
  <g transform="translate(490, 95)">
    <rect x="0" y="0" width="330" height="380" rx="12" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
    <rect x="0" y="0" width="330" height="45" rx="12" fill="#dc2626"/>
    <rect x="0" y="30" width="330" height="15" fill="#dc2626"/>
    <text x="165" y="28" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">損益通算できない所得 （赤字不可）</text>

    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="300" height="300" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="20" y="35" font-size="14" font-weight="bold" fill="#b91c1c">• 雑所得 （暗号資産・副業等）</text>
      <text x="35" y="55" font-size="12" fill="#64748b">※雑所得同士の相殺は可能だが他所得とは不可</text>

      <text x="20" y="90" font-size="14" font-weight="bold" fill="#b91c1c">• 一時所得 （懸賞・生命保険満期金等）</text>
      <text x="20" y="125" font-size="14" font-weight="bold" fill="#b91c1c">• 利子所得 ・ 配当所得</text>
      <text x="35" y="145" font-size="12" fill="#64748b">※上場株式配当と株式譲渡損失は申告分離課税で通算可</text>

      <text x="20" y="180" font-size="14" font-weight="bold" fill="#b91c1c">• 給与所得 ・ 退職所得</text>
      <text x="35" y="200" font-size="12" fill="#64748b">※そもそも赤字（マイナス）概念が存在しない</text>

      <rect x="15" y="225" width="270" height="60" rx="6" fill="#fef2f2" stroke="#dc2626"/>
      <text x="150" y="250" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">【注意】 雑所得の赤字は</text>
      <text x="150" y="270" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">給与所得と一切通算できません！</text>
    </g>
  </g>
</svg>
