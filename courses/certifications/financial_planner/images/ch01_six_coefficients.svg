<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;">
  <!-- Header -->
  <rect x="20" y="20" width="800" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="55" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">【FP重要必須】 6つの係数の使い分けマトリクス</text>

  <!-- Group 1: 一括運用 -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="250" height="380" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="45" rx="12" fill="#2563eb"/>
    <rect x="0" y="30" width="250" height="15" fill="#2563eb"/>
    <text x="125" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">一括運用の往復</text>
    <text x="125" y="65" font-size="13" fill="#64748b" text-anchor="middle">まとまった資金を運用</text>

    <!-- Card A: 終価係数 -->
    <rect x="15" y="85" width="220" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="25" y="112" font-size="16" font-weight="bold" fill="#1d4ed8">終価係数</text>
    <text x="25" y="135" font-size="13" fill="#0f172a">現在 → 将来額を求める</text>
    <path d="M 30 155 L 180 155" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="25" y="185" font-size="12" fill="#475569">例: 100万円を複利3%で</text>
    <text x="25" y="202" font-size="12" fill="#475569">    10年運用した将来額</text>

    <!-- Card B: 現価係数 -->
    <rect x="15" y="230" width="220" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="25" y="257" font-size="16" font-weight="bold" fill="#1d4ed8">現価係数</text>
    <text x="25" y="280" font-size="13" fill="#0f172a">将来目標 ← 必要元本を求める</text>
    <path d="M 180 300 L 30 300" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="25" y="330" font-size="12" fill="#475569">例: 10年後に100万円得る</text>
    <text x="25" y="347" font-size="12" fill="#475569">    ために必要な現在の元本</text>
  </g>

  <!-- Group 2: 積立運用 -->
  <g transform="translate(295, 95)">
    <rect x="0" y="0" width="250" height="380" rx="12" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="45" rx="12" fill="#059669"/>
    <rect x="0" y="30" width="250" height="15" fill="#059669"/>
    <text x="125" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">積立運用の往復</text>
    <text x="125" y="65" font-size="13" fill="#64748b" text-anchor="middle">毎年一定額を積み立てる</text>

    <!-- Card C: 年金終価係数 -->
    <rect x="15" y="85" width="220" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="25" y="112" font-size="16" font-weight="bold" fill="#047857">年金終価係数</text>
    <text x="25" y="135" font-size="13" fill="#0f172a">毎年積立 → 将来合計額</text>
    <path d="M 30 155 L 180 155" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="25" y="185" font-size="12" fill="#475569">例: 毎年10万円を10年</text>
    <text x="25" y="202" font-size="12" fill="#475569">    積み立てた場合の将来額</text>

    <!-- Card D: 減債基金係数 -->
    <rect x="15" y="230" width="220" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="25" y="257" font-size="16" font-weight="bold" fill="#047857">減債基金係数</text>
    <text x="25" y="280" font-size="13" fill="#0f172a">将来目標 ← 毎年の積立額</text>
    <path d="M 180 300 L 30 300" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="25" y="330" font-size="12" fill="#475569">例: 10年後に1000万円貯める</text>
    <text x="25" y="347" font-size="12" fill="#475569">    ために必要な毎年の積立額</text>
  </g>

  <!-- Group 3: 取崩し・年金 -->
  <g transform="translate(570, 95)">
    <rect x="0" y="0" width="250" height="380" rx="12" fill="#f8fafc" stroke="#d97706" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="45" rx="12" fill="#d97706"/>
    <rect x="0" y="30" width="250" height="15" fill="#d97706"/>
    <text x="125" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">取り崩しの往復</text>
    <text x="125" y="65" font-size="13" fill="#64748b" text-anchor="middle">元本を取り崩して受給</text>

    <!-- Card E: 資本回収係数 -->
    <rect x="15" y="85" width="220" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="25" y="112" font-size="16" font-weight="bold" fill="#b45309">資本回収係数</text>
    <text x="25" y="135" font-size="13" fill="#0f172a">現在の元本 → 毎年の受取額</text>
    <path d="M 30 155 L 180 155" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
    <text x="25" y="185" font-size="12" fill="#475569">例: 2000万円を取り崩して</text>
    <text x="25" y="202" font-size="12" fill="#475569">    20年間で受け取れる年額</text>

    <!-- Card F: 年金現価係数 -->
    <rect x="15" y="230" width="220" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="25" y="257" font-size="16" font-weight="bold" fill="#b45309">年金現価係数</text>
    <text x="25" y="280" font-size="13" fill="#0f172a">希望受取額 ← 必要原資</text>
    <path d="M 180 300 L 30 300" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
    <text x="25" y="330" font-size="12" fill="#475569">例: 毎年100万円を20年受け取る</text>
    <text x="25" y="347" font-size="12" fill="#475569">    ために必要な現在の準備元本</text>
  </g>

  <!-- Markers -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706" />
    </marker>
  </defs>
</svg>
