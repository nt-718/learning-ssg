<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;">
  <!-- Header -->
  <rect x="20" y="20" width="800" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="55" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">【FP実技・計算必須】 相続税計算の4ステップ手順</text>

  <!-- Step 1 -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="800" height="85" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="85" rx="10" fill="#2563eb"/>
    <rect x="130" y="0" width="10" height="85" fill="#2563eb"/>
    <text x="70" y="38" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Step 1</text>
    <text x="70" y="60" font-size="13" fill="#dbeafe" text-anchor="middle">課税価格の計算</text>

    <text x="160" y="32" font-size="15" font-weight="bold" fill="#1d4ed8">各人の課税価格 ＝ （本来の財産 ＋ みなし財産） － （非課税 ＋ 債務・葬式費用） ＋ 贈与加算</text>
    <text x="160" y="58" font-size="12" fill="#64748b">※生命保険金・退職金の非課税限度額 ＝ 500万円 × 法定相続人の数</text>
    <text x="160" y="75" font-size="12" fill="#64748b">※全員の課税価格を合計して「課税価格の合計額」を算出</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 420 180 L 420 195" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-inh)"/>

  <!-- Step 2 -->
  <g transform="translate(20, 195)">
    <rect x="0" y="0" width="800" height="85" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="85" rx="10" fill="#059669"/>
    <rect x="130" y="0" width="10" height="85" fill="#059669"/>
    <text x="70" y="38" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Step 2</text>
    <text x="70" y="60" font-size="13" fill="#d1fae5" text-anchor="middle">基礎控除の適用</text>

    <text x="160" y="32" font-size="16" font-weight="bold" fill="#047857">課税遺産総額 ＝ 課税価格の合計額 － 基礎控除額</text>
    <rect x="160" y="44" width="480" height="32" rx="6" fill="#fffbeb" stroke="#059669"/>
    <text x="400" y="65" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">【基礎控除額】 3,000万円 ＋ 600万円 × 法定相続人の数</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 420 280 L 420 295" stroke="#059669" stroke-width="3" marker-end="url(#arrow-inh)"/>

  <!-- Step 3 -->
  <g transform="translate(20, 295)">
    <rect x="0" y="0" width="800" height="85" rx="10" fill="#f8fafc" stroke="#d97706" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="85" rx="10" fill="#d97706"/>
    <rect x="130" y="0" width="10" height="85" fill="#d97706"/>
    <text x="70" y="38" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Step 3</text>
    <text x="70" y="60" font-size="13" fill="#fef3c7" text-anchor="middle">相続税総額の計算</text>

    <text x="160" y="32" font-size="15" font-weight="bold" fill="#b45309">課税遺産総額を「仮に法定相続分通りに分割」したものとして各自の税額を計算</text>
    <text x="160" y="58" font-size="13" fill="#0f172a">［各人の仮の取得額 × 税率 ＝ 各人の税額］を全メンバー分合計 ＝ 「相続税の総額」</text>
    <text x="160" y="75" font-size="12" fill="#b91c1c">※実際の遺産分割割合は関係なく、まずは法定相続分で計算するのが最大のポイント！</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 420 380 L 420 395" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-inh)"/>

  <!-- Step 4 -->
  <g transform="translate(20, 395)">
    <rect x="0" y="0" width="800" height="110" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="110" rx="10" fill="#dc2626"/>
    <rect x="130" y="0" width="10" height="110" fill="#dc2626"/>
    <text x="70" y="50" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Step 4</text>
    <text x="70" y="72" font-size="13" fill="#fee2e2" text-anchor="middle">各人納付額の計算</text>

    <text x="160" y="30" font-size="15" font-weight="bold" fill="#b91c1c">相続税の総額 × 「実際の取得割合」 ＝ 各人の仮納付税額</text>
    <text x="160" y="55" font-size="13" fill="#0f172a">• <tspan font-weight="bold" fill="#1d4ed8">配偶者の税額軽減：</tspan> 1億6,000万円 または 法定相続分まで税額ゼロ！</text>
    <text x="160" y="78" font-size="13" fill="#0f172a">• <tspan font-weight="bold" fill="#b91c1c">2割加算：</tspan> 配偶者・一親等の血族（子・父母）以外の者が取得した場合は税額2割増</text>
    <text x="160" y="100" font-size="12" fill="#64748b">※贈与税額控除・未成年者控除・障害者控除等を差し引いて「各人の納付税額」が完成</text>
  </g>

  <defs>
    <marker id="arrow-inh" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>
</svg>
