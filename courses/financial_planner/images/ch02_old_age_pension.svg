<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;">
  <!-- Header -->
  <rect x="20" y="20" width="800" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="55" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">老齢年金の給付内訳 と 繰上げ・繰下げ受給の仕組み</text>

  <!-- Left: Pension Component Breakdown -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="370" height="380" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="370" height="45" rx="12" fill="#2563eb"/>
    <rect x="0" y="30" width="370" height="15" fill="#2563eb"/>
    <text x="185" y="28" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">老齢年金の給付構成（原則65歳支給）</text>

    <!-- Component 4: 加給年金 -->
    <rect x="20" y="60" width="330" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="35" y="85" font-size="15" font-weight="bold" fill="#b45309">加給年金 （家族手当的給付）</text>
    <text x="35" y="106" font-size="12" fill="#475569">厚生年金20年以上 ＋ 65歳未満の配偶者・子を扶養</text>

    <!-- Component 3: 経過的加算 -->
    <rect x="20" y="130" width="330" height="45" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="35" y="157" font-size="14" font-weight="bold" fill="#0f172a">経過的加算 （差額調整分）</text>

    <!-- Component 2: 老齢厚生年金 -->
    <rect x="20" y="185" width="330" height="85" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="35" y="215" font-size="16" font-weight="bold" fill="#1d4ed8">老齢厚生年金 （報酬比例部分）</text>
    <text x="35" y="240" font-size="13" stroke-linecap="round" fill="#475569">平均標準報酬額 × 5.481/1000 × 加入月数</text>

    <!-- Component 1: 老齢基礎年金 -->
    <rect x="20" y="280" width="330" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="35" y="310" font-size="16" font-weight="bold" fill="#047857">老齢基礎年金 （定額部分）</text>
    <text x="35" y="335" font-size="13" fill="#475569">満額 ×（保険料納付済月数 ÷ 480か月）</text>
  </g>

  <!-- Right: Early & Deferred Pension -->
  <g transform="translate(410, 95)">
    <rect x="0" y="0" width="410" height="380" rx="12" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="410" height="45" rx="12" fill="#059669"/>
    <rect x="0" y="30" width="410" height="15" fill="#059669"/>
    <text x="205" y="28" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">受給開始時期の選択（繰上げ・繰下げ）</text>

    <!-- Kuriage Box -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="370" height="90" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="20" y="30" font-size="16" font-weight="bold" fill="#b91c1c">【繰上げ受給】 60歳 〜 64歳</text>
      <text x="20" y="55" font-size="14" font-weight="bold" fill="#dc2626">減額率： 1か月あたり －0.4％</text>
      <text x="20" y="75" font-size="12" fill="#475569">※60歳から受給する場合は最大 －24％（生涯固定）</text>
    </g>

    <!-- Standard Box -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="370" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="185" y="30" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">【原則】 65歳受給開始 （増減なし 100％）</text>
    </g>

    <!-- Kurisage Box -->
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="370" height="140" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
      <text x="20" y="30" font-size="16" font-weight="bold" fill="#047857">【繰下げ受給】 66歳 〜 75歳</text>
      <text x="20" y="55" font-size="14" font-weight="bold" fill="#059669">増額率： 1か月あたり ＋0.7％</text>
      <text x="20" y="80" font-size="13" fill="#0f172a">• 70歳から受給： ＋42％ 増額</text>
      <text x="20" y="102" font-size="13" fill="#0f172a">• 75歳から受給： 最大 ＋84％ 増額（生涯固定）</text>
      <text x="20" y="124" font-size="11" fill="#64748b">※基礎年金と厚生年金は別々に繰下げ可能</text>
    </g>
  </g>
</svg>
