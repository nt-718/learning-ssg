<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;">
  <!-- Header -->
  <rect x="20" y="20" width="800" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="55" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">金利と債券価格の「シーソー関係」＆ 債券利回りの構造</text>

  <!-- Left: Seesaw Visual -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="380" height="380" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="45" rx="12" fill="#2563eb"/>
    <rect x="0" y="30" width="380" height="15" fill="#2563eb"/>
    <text x="190" y="28" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">金利と債券価格のシーソー関係（逆の動き）</text>

    <!-- Case A: Interest Rate UP -> Bond Price DOWN -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="350" height="145" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
      <text x="175" y="28" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">【パターンA】 市場金利が「上昇」したとき</text>
      
      <!-- Seesaw Plank tilted -->
      <line x1="40" y1="65" x2="310" y2="105" stroke="#64748b" stroke-width="6"/>
      <polygon points="175,85 165,115 185,115" fill="#2563eb"/>

      <!-- Left Weight: 金利 UP -->
      <rect x="30" y="45" width="70" height="35" rx="6" fill="#dc2626"/>
      <text x="65" y="68" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">金利 ↑</text>

      <!-- Right Weight: 債券価格 DOWN -->
      <rect x="250" y="90" width="70" height="35" rx="6" fill="#059669"/>
      <text x="285" y="113" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">価格 ↓</text>
      <text x="175" y="135" font-size="12" fill="#0f172a" text-anchor="middle">※既存債券の魅力低下 → 債券価格は【下落】</text>
    </g>

    <!-- Case B: Interest Rate DOWN -> Bond Price UP -->
    <g transform="translate(15, 215)">
      <rect x="0" y="0" width="350" height="145" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="175" y="28" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">【パターンB】 市場金利が「低下」したとき</text>
      
      <!-- Seesaw Plank tilted opposite -->
      <line x1="40" y1="105" x2="310" y2="65" stroke="#64748b" stroke-width="6"/>
      <polygon points="175,85 165,115 185,115" fill="#2563eb"/>

      <!-- Left Weight: 金利 DOWN -->
      <rect x="30" y="90" width="70" height="35" rx="6" fill="#059669"/>
      <text x="65" y="113" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">金利 ↓</text>

      <!-- Right Weight: 債券価格 UP -->
      <rect x="250" y="45" width="70" height="35" rx="6" fill="#dc2626"/>
      <text x="285" y="68" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">価格 ↑</text>
      <text x="175" y="135" font-size="12" fill="#0f172a" text-anchor="middle">※既存債券の魅力上昇 → 債券価格は【上昇】</text>
    </g>
  </g>

  <!-- Right: Bond Yield Calculation Formulas -->
  <g transform="translate(420, 95)">
    <rect x="0" y="0" width="400" height="380" rx="12" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="45" rx="12" fill="#059669"/>
    <rect x="0" y="30" width="400" height="15" fill="#059669"/>
    <text x="200" y="28" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">債券利回り（年利回り％）共通計算式</text>

    <!-- General Formula Box -->
    <rect x="15" y="60" width="370" height="95" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="200" y="85" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">【単利利回りの共通分子公式】</text>
    <text x="200" y="115" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">［ 表面利率 ＋ (売却・償還額 － 購入額) ÷ 所有年数 ］</text>
    <line x1="35" y1="125" x2="365" y2="125" stroke="#d97706" stroke-width="1.5"/>
    <text x="200" y="145" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">購入価格　× 100</text>

    <!-- 4 Types -->
    <g transform="translate(15, 170)">
      <rect x="0" y="0" width="370" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="15" y="25" font-size="13" font-weight="bold" fill="#1d4ed8">1. 応募者利回り:</text>
      <text x="130" y="25" font-size="12" fill="#0f172a">新発債を【発行価格】で買い【償還】まで</text>

      <text x="15" y="65" font-size="13" font-weight="bold" fill="#1d4ed8">2. 最終利回り:</text>
      <text x="130" y="65" font-size="12" fill="#0f172a">既発債を【購入価格】で買い【償還】まで</text>

      <text x="15" y="105" font-size="13" font-weight="bold" fill="#1d4ed8">3. 所有期間利回り:</text>
      <text x="130" y="105" font-size="12" fill="#0f172a">途中で購入し【売却価格】で【途中売却】</text>

      <text x="15" y="145" font-size="13" font-weight="bold" fill="#1d4ed8">4. 直接利回り:</text>
      <text x="130" y="145" font-size="12" fill="#0f172a">値動き無視＝［ 表面利率 ÷ 購入価格 ］× 100</text>
    </g>
  </g>
</svg>
