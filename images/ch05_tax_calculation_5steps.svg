<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;">
  <!-- Header -->
  <rect x="20" y="20" width="800" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="55" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">【FP最頻出】 所得税計算の5段階フローチャート</text>

  <!-- Step 1 -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="800" height="70" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#2563eb"/>
    <rect x="130" y="0" width="10" height="70" fill="#2563eb"/>
    <text x="70" y="32" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Step 1</text>
    <text x="70" y="52" font-size="13" fill="#dbeafe" text-anchor="middle">各所得の計算</text>

    <text x="160" y="30" font-size="16" font-weight="bold" fill="#1d4ed8">収入金額 － 必要経費（または給与所得控除等） ＝ 「各所得の金額」</text>
    <text x="160" y="55" font-size="12" fill="#64748b">※10種類の所得（利子・配当・不動産・事業・給与・退職・山林・譲渡・一時・雑）それぞれで計算</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 420 165 L 420 180" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-tax)"/>

  <!-- Step 2 -->
  <g transform="translate(20, 180)">
    <rect x="0" y="0" width="800" height="70" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#059669"/>
    <rect x="130" y="0" width="10" height="70" fill="#059669"/>
    <text x="70" y="32" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Step 2</text>
    <text x="70" y="52" font-size="13" fill="#d1fae5" text-anchor="middle">課税標準の計算</text>

    <text x="160" y="30" font-size="16" font-weight="bold" fill="#047857">損益通算 ＆ 繰越控除 ＝ 「総所得金額等」</text>
    <text x="160" y="55" font-size="12" fill="#64748b">※赤字が出た場合は「富士山（不動産・事業・譲渡・山林）」の赤字のみ他所得と損益通算</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 420 250 L 420 265" stroke="#059669" stroke-width="3" marker-end="url(#arrow-tax)"/>

  <!-- Step 3 -->
  <g transform="translate(20, 265)">
    <rect x="0" y="0" width="800" height="70" rx="10" fill="#f8fafc" stroke="#d97706" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#d97706"/>
    <rect x="130" y="0" width="10" height="70" fill="#d97706"/>
    <text x="70" y="32" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Step 3</text>
    <text x="70" y="52" font-size="13" fill="#fef3c7" text-anchor="middle">課税所得の計算</text>

    <text x="160" y="30" font-size="16" font-weight="bold" fill="#b45309">総所得金額等 － 所得控除（15種類） ＝ 「課税総所得金額」</text>
    <text x="160" y="55" font-size="12" fill="#64748b">※基礎控除、配偶者(特別)控除、扶養控除、社会保険料控除、医療費控除、生命保険料控除など</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 420 335 L 420 350" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-tax)"/>

  <!-- Step 4 -->
  <g transform="translate(20, 350)">
    <rect x="0" y="0" width="800" height="70" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#7c3aed"/>
    <rect x="130" y="0" width="10" height="70" fill="#7c3aed"/>
    <text x="70" y="32" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Step 4</text>
    <text x="70" y="52" font-size="13" fill="#ede9fe" text-anchor="middle">算出税額の計算</text>

    <text x="160" y="30" font-size="16" font-weight="bold" fill="#6d28d9">課税総所得金額 × 超過累進税率（5％〜45％） ＝ 「算出税額」</text>
    <text x="160" y="55" font-size="12" fill="#64748b">※課税金額に応じて7段階の累進税率を適用（控除額を差し引いて迅速計算）</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 420 420 L 420 435" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-tax)"/>

  <!-- Step 5 -->
  <g transform="translate(20, 435)">
    <rect x="0" y="0" width="800" height="75" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="75" rx="10" fill="#dc2626"/>
    <rect x="130" y="0" width="10" height="75" fill="#dc2626"/>
    <text x="70" y="34" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Step 5</text>
    <text x="70" y="54" font-size="13" fill="#fee2e2" text-anchor="middle">納付税額の計算</text>

    <text x="160" y="32" font-size="16" font-weight="bold" fill="#b91c1c">算出税額 － 税額控除（住宅ローン控除等） ＝ 「基準所得税額」</text>
    <text x="160" y="58" font-size="12" fill="#64748b">※最終納付額 ＝ 基準所得税額 × 102.1％（復興特別所得税 2.1％を付加）</text>
  </g>

  <!-- Marker definition -->
  <defs>
    <marker id="arrow-tax" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>
</svg>
