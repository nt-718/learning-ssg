<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;">
  <!-- Header -->
  <rect x="20" y="20" width="800" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="55" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">【FP超重要】 新NISA制度の全体構造（非課税無期限化・併用化）</text>

  <!-- 2 Investment Frames (Left & Right Boxes) -->
  <!-- Left: つみたて投資枠 -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="380" height="250" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="45" rx="12" fill="#2563eb"/>
    <rect x="0" y="30" width="380" height="15" fill="#2563eb"/>
    <text x="190" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">つみたて投資枠</text>

    <!-- Details -->
    <rect x="15" y="60" width="350" height="50" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="30" y="90" font-size="15" font-weight="bold" fill="#1d4ed8">年間投資上限額： 120 万円</text>

    <text x="20" y="135" font-size="14" fill="#0f172a">• <tspan font-weight="bold" fill="#1d4ed8">買付方法：</tspan> 積立投資のみ</text>
    <text x="20" y="165" font-size="14" fill="#0f172a">• <tspan font-weight="bold" fill="#1d4ed8">対象商品：</tspan> 長期・積立・分散投資に適合する</text>
    <text x="38" y="185" font-size="13" fill="#64748b">公募株式投資信託・ETF（一定の基準を満たす）</text>
    <text x="20" y="215" font-size="14" fill="#0f172a">• <tspan font-weight="bold" fill="#1d4ed8">非課税期間：</tspan> 無期限化</text>
  </g>

  <!-- Right: 成長投資枠 -->
  <g transform="translate(440, 95)">
    <rect x="0" y="0" width="380" height="250" rx="12" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="45" rx="12" fill="#059669"/>
    <rect x="0" y="30" width="380" height="15" fill="#059669"/>
    <text x="190" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">成長投資枠</text>

    <!-- Details -->
    <rect x="15" y="60" width="350" height="50" rx="8" fill="#ecfdf5" stroke="#059669"/>
    <text x="30" y="90" font-size="15" font-weight="bold" fill="#047857">年間投資上限額： 240 万円</text>

    <text x="20" y="135" font-size="14" fill="#0f172a">• <tspan font-weight="bold" fill="#047857">買付方法：</tspan> 一括購入・積立購入ともに可能</text>
    <text x="20" y="165" font-size="14" fill="#0f172a">• <tspan font-weight="bold" fill="#047857">対象商品：</tspan> 上場株式・公募株式投資信託・REIT等</text>
    <text x="38" y="185" font-size="13" fill="#64748b">（高整理・監理銘柄や毎月分配型等は除外）</text>
    <text x="20" y="215" font-size="14" fill="#0f172a">• <tspan font-weight="bold" fill="#047857">非課税期間：</tspan> 無期限化</text>
  </g>

  <!-- Total Capacity & Lifetime Limit (Bottom) -->
  <g transform="translate(20, 360)">
    <rect x="0" y="0" width="800" height="140" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <rect x="0" y="0" width="800" height="40" rx="12" fill="#d97706"/>
    <rect x="0" y="25" width="800" height="15" fill="#d97706"/>
    <text x="400" y="26" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">【併用可能】 年間最大 360 万円 ＆ 生涯非課税保有限度額 1,800 万円</text>

    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="360" height="65" rx="8" fill="#ffffff" stroke="#d97706"/>
      <text x="180" y="28" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">生涯非課税保有限度額： 1,800 万円</text>
      <text x="180" y="50" font-size="13" fill="#0f172a" text-anchor="middle">（うち成長投資枠は最大 1,200 万円まで）</text>
    </g>

    <g transform="translate(400, 55)">
      <rect x="0" y="0" width="380" height="65" rx="8" fill="#ffffff" stroke="#d97706"/>
      <text x="190" y="28" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">枠の再利用（売却時）</text>
      <text x="190" y="50" font-size="13" fill="#0f172a" text-anchor="middle">売却した商品の【簿価（取得価額）】分が翌年復活</text>
    </g>
  </g>
</svg>
